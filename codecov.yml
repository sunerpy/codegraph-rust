# Coverage remains informational: 95% is the ratchet target, not a merge gate.
# Measured 2026-09-15: 94.73% lines, 94.44% regions, 93.73% functions.
coverage:
  status:
    project:
      default:
        target: 95%
        informational: true
    patch:
      default:
        target: 95%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default

ignore:
  - "crates/codegraph-bench/**"
