# Pushes the pages of the CodeGraph website into sunerpy/firlab, which builds it and publishes it
# inside firlab.app at https://firlab.app/codegraph/ (firlab: `codegraph/`,
# `.github/workflows/deploy.yml`). docs/site/README.md describes the whole path.
#
# The sync pushes instead of the site pulling: the event that should update the site, a merge here,
# happens in this repository, and the credential stays here and reaches firlab only. The copy rules
# and checks live in firlab's sync script, which a local preview runs too, so this workflow and a
# preview produce the same tree.
#
# Needs FIRLAB_DOCS_TOKEN: a fine-grained personal access token for sunerpy/firlab only, with
# Contents read and write and nothing else. GitHub has no API that creates one, so it is made by
# hand (docs/site/README.md, "One-time setup"). Without it the first step fails and says so.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "!docs/site/README.md"
      - "!docs/site/tools/**"
      - "docs/cli.md"
      - "docs/mcp.md"
      - "docs/ui.md"
      - "docs/languages.md"
      - "docs/godot.md"
      - "docs/troubleshooting.md"
      - "docs/architecture.md"
      - "docs/data-model.md"
      - "docs/equivalence.md"
      - "docs/grammar-manifest.md"
      - "docs/embedded-extraction.md"
      - "docs/benchmark.md"
      - "docs/benchmark-results.md"
      - ".github/workflows/docs-site.yml"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

# Queue, never cancel: a cancelled run could leave a pushed sync without its successor.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Push the site's pages to firlab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the firlab token
        env:
          FIRLAB_DOCS_TOKEN: ${{ secrets.FIRLAB_DOCS_TOKEN }}
        run: |
          if [ -z "${FIRLAB_DOCS_TOKEN}" ]; then
            echo "::error::FIRLAB_DOCS_TOKEN is not set, so the site cannot be updated. docs/site/README.md, One-time setup, says how to create it."
            exit 1
          fi

      - name: Checkout codegraph-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: codegraph-rust
          persist-credentials: false

      # Full history, so a rejected push can rebase onto a newer main.
      - name: Checkout firlab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sunerpy/firlab
          token: ${{ secrets.FIRLAB_DOCS_TOKEN }}
          path: firlab
          fetch-depth: 0

      - name: Sync the pages
        run: ./firlab/codegraph/scripts/sync-codegraph-docs.sh "$GITHUB_WORKSPACE/codegraph-rust"

      - name: Commit and push
        working-directory: firlab
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `git status`, not `git diff`: a new page is an untracked file, which `git diff` misses.
          if [ -z "$(git status --porcelain -- codegraph/src)" ]; then
            echo "the site is already up to date; nothing to push"
            exit 0
          fi

          # The sync writes nowhere else; staging the tree by name keeps anything else out.
          git add -- codegraph/src
          git -c user.name='codegraph-docs[bot]' \
              -c user.email='codegraph-docs@users.noreply.github.com' \
              commit -m "docs(codegraph): sync from codegraph-rust@${SOURCE_SHA:0:7}" \
                     -m "Source: https://github.com/sunerpy/codegraph-rust/commit/${SOURCE_SHA}"

          # The other product sites' syncs push to the same branch. They touch other directories,
          # so a rejected push rebases onto the new tip and tries again.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main"
            git -c user.name='codegraph-docs[bot]' \
                -c user.email='codegraph-docs@users.noreply.github.com' \
                pull --rebase origin main
          done
          echo "::error::the sync commit could not be pushed after 3 attempts"
          exit 1
