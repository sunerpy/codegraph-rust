[package]
name = "codegraph-watch"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Debounced file watcher and incremental sync for CodeGraph-rs."
readme = "../../README.md"

[features]
# Test seams for dependents' test builds (e.g. publishing a watcher health
# without a running watcher). NEVER enabled in the shipped binary.
test-hooks = []

[dependencies]
serde = { workspace = true }
anyhow = { workspace = true }
notify = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
codegraph-core = { path = "../codegraph-core" }
codegraph-extract = { path = "../codegraph-extract" }
codegraph-resolve = { path = "../codegraph-resolve" }
codegraph-store = { path = "../codegraph-store" }

[dev-dependencies]
# Self-reference with `test-hooks`, so integration tests compile the writer
# seams in (the pattern `codegraph-mcp` uses); the shipped binary never does.
codegraph-watch = { path = ".", features = ["test-hooks"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
