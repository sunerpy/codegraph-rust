[package]
name = "codegraph-ui"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Local browser viewer for CodeGraph-rs: the loopback HTTP API and the embedded web app."
readme = "../../README.md"
build = "build.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
notify = { workspace = true }
rusqlite = { workspace = true }
codegraph-core = { path = "../codegraph-core" }
codegraph-store = { path = "../codegraph-store" }
codegraph-graph = { path = "../codegraph-graph" }
codegraph-extract = { path = "../codegraph-extract" }
codegraph-resolve = { path = "../codegraph-resolve" }
codegraph-watch = { path = "../codegraph-watch" }
# The dynamic-dispatch scanner `codegraph_explore` already uses, for the Flow end cap.
codegraph-mcp = { path = "../codegraph-mcp" }
# The same HTTP stack the MCP streamable-HTTP server already links.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
percent-encoding = "2.3"
form_urlencoded = "1.2"
httpdate = "1"
http-body-util = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
